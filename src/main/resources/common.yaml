sf:
  readtimeout: "120"
  query:
    fetch:
      workOrder: Select Id,Number_Of_Assets__c,WorkTypeId,LineItemCount From WorkOrder where Purchase_Order_No__c =':purchaseOrderNo' and Customer_Reference_Number__c=':workTicketNumber'
      serviceAppointment: Select Id From ServiceAppointment where ParentRecordID=':workOrderId'
      account: SELECT Id FROM Account WHERE RecordTypeId =':recordTypeId' AND Name LIKE ':name' AND ShippingPostalCode =':zipCode'
      product: SELECT Id FROM Product2 WHERE External_ID__c=':material' AND IsActive =:isActive AND Company__c =':company'
  
  product:
    isActive: "true"
    company: "HFG USA"
  
  object:
    account: Account
    account_external_id: Id
    workorder: WorkOrder
    workorder_external_id: Id
    serviceAptmt: ServiceAppointment
    serviceAptmt_external_id: Id
    product: ProductRequired
    product_external_id: Id
    asset: Asset
    asset_external_id: Id
    woli: WorkOrderLineItem
    woli_external_id: Id

  